name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Actions タブから手動でも再デプロイできるようにしておく
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 連続 push でデプロイが競合しないよう直列化する（実行中のものは止めない）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Vite 8 の要求（Node 20.19+ / 22.12+）を満たすバージョン
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
