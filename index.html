<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oddly Satisfying 3D — Three.js</title>
<style>
  /* 就寝前に眺める前提で、UI からも青い光を抜いている */
  :root {
    --bg: #080607;
    --fg: #f0e2d6;
    --dim: #a08a7d;
    --accent: #ffb37a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
                 "Hiragino Sans", "Yu Gothic", sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }

  /* 画面の四隅を少し落として中央に視線を集める */
  #vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center,
                rgba(0,0,0,0) 42%, rgba(6,4,5,.62) 100%);
  }

  #fade {
    position: fixed; inset: 0; pointer-events: none;
    background: var(--bg); opacity: 0;
    transition: opacity .35s ease;
  }

  #hud {
    position: fixed; left: 24px; bottom: 24px;
    pointer-events: none; user-select: none;
    text-shadow: 0 2px 12px rgba(0,0,0,.8);
  }
  #title {
    font-size: 26px; font-weight: 600; letter-spacing: .02em;
    margin: 0 0 4px;
  }
  #desc { margin: 0; font-size: 13px; color: var(--dim); line-height: 1.6; }

  /* 12 個あるので折り返さず 1 行に並べ、はみ出した分は横スクロールで見せる */
  #tabs {
    position: fixed; left: 24px; top: 24px; right: 24px;
    display: flex; gap: 8px; flex-wrap: nowrap;
    overflow-x: auto; scrollbar-width: none; padding-bottom: 4px;
    -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 48px), transparent);
    mask-image: linear-gradient(to right, #000 calc(100% - 48px), transparent);
  }
  #tabs::-webkit-scrollbar { display: none; }
  .tab {
    appearance: none; flex: 0 0 auto;
    border: 1px solid rgba(255,214,180,.14);
    background: rgba(255,214,180,.05); color: var(--dim);
    padding: 7px 14px; border-radius: 999px;
    font-size: 12px; font-family: inherit; cursor: pointer;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: color .2s, border-color .2s, background .2s;
  }
  .tab:hover { color: var(--fg); border-color: rgba(255,214,180,.32); }
  .tab.on {
    color: #1a0f0a; background: var(--accent);
    border-color: var(--accent); font-weight: 600;
  }

  /* 効果音ボタンとキー説明を右下にまとめる */
  #corner {
    position: fixed; right: 24px; bottom: 24px;
    display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
  }
  #help {
    font-size: 11px; color: var(--dim); text-align: right;
    line-height: 1.8; pointer-events: none; user-select: none;
  }

  #sound {
    appearance: none; cursor: pointer;
    display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid rgba(255,214,180,.14);
    background: rgba(255,214,180,.05); color: var(--dim);
    padding: 7px 14px; border-radius: 999px;
    font-size: 12px; font-family: inherit; letter-spacing: .02em;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: color .2s, border-color .2s, background .2s;
  }
  #sound:hover { color: var(--fg); border-color: rgba(255,214,180,.32); }
  #sound.on {
    color: #1a0f0a; background: var(--accent);
    border-color: var(--accent); font-weight: 600;
  }
  kbd {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10px; border: 1px solid rgba(255,214,180,.2);
    border-radius: 4px; padding: 1px 5px; color: var(--fg);
  }

  @media (max-width: 640px) {
    #title { font-size: 19px; }
    #help { display: none; }
    #hud { left: 16px; bottom: 16px; }
    #corner { right: 16px; bottom: 16px; }
    #tabs { left: 16px; top: 16px; right: 16px; gap: 6px; }
    .tab { padding: 6px 11px; font-size: 11px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>
<div id="fade"></div>

<nav id="tabs"></nav>

<div id="hud">
  <h1 id="title"></h1>
  <p id="desc"></p>
</div>

<div id="corner">
  <button id="sound" type="button" aria-pressed="false">♪ 効果音 OFF</button>
  <div id="help">
    <div><kbd>1</kbd>–<kbd>9</kbd> シーン切替 / <kbd>←</kbd><kbd>→</kbd> 前後（全 12 シーン）</div>
    <div><kbd>Space</kbd> 自動切替 / <kbd>S</kbd> 効果音 ON/OFF・ドラッグで視点回転</div>
  </div>
</div>

<script type="module" src="/src/main.ts"></script>

</body>
</html>
