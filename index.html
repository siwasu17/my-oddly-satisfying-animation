<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oddly Satisfying 3D — Three.js</title>
<meta name="description" content="就寝前に眺めるための、暖色だけでつくった 16 のループアニメーション。">

<!-- ホーム画面に追加して全画面で眺められるようにする -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#080607">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- 背景が暗いので、iOS ではステータスバーも本編に溶かす -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Satisfying">
<style>
  /* 就寝前に眺める前提で、UI からも青い光を抜いている */
  :root {
    --bg: #080607;
    --fg: #f0e2d6;
    --dim: #a08a7d;
    --accent: #ffb37a;
    /* 画面端からの余白。狭い画面では @media で詰める */
    --pad: 24px;
    /* PWA の全画面表示ではノッチ・ホームバーを避ける */
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
                 "Hiragino Sans", "Yu Gothic", sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }

  /* 画面の四隅を少し落として中央に視線を集める */
  #vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center,
                rgba(0,0,0,0) 42%, rgba(6,4,5,.62) 100%);
  }

  #fade {
    position: fixed; inset: 0; pointer-events: none;
    background: var(--bg); opacity: 0;
    transition: opacity .35s ease;
  }

  /*
   * UI はすべてこの 1 枚に載せる。互いの高さが分かる並びになるので、
   * 狭い画面で上下を組み替えても要素が重ならない。
   */
  #chrome {
    position: fixed; inset: 0;
    padding: calc(var(--pad) + var(--safe-t)) calc(var(--pad) + var(--safe-r))
             calc(var(--pad) + var(--safe-b)) calc(var(--pad) + var(--safe-l));
    display: flex; flex-direction: column; justify-content: space-between;
    gap: 12px;
    pointer-events: none; /* 映像のドラッグ回転を邪魔しない */
  }

  /* 説明文と効果音ボタンは同じ帯に並べ、重ならないようにする */
  #bottom {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 16px;
  }
  #hud {
    user-select: none;
    text-shadow: 0 2px 12px rgba(0,0,0,.8);
  }
  #title {
    font-size: 26px; font-weight: 600; letter-spacing: .02em;
    margin: 0 0 4px;
  }
  #desc { margin: 0; font-size: 13px; color: var(--dim); line-height: 1.6; }

  /* 12 個あるので折り返さず 1 行に並べ、はみ出した分は横スクロールで見せる */
  #tabs {
    pointer-events: auto;
    display: flex; gap: 8px; flex-wrap: nowrap;
    overflow-x: auto; scrollbar-width: none; padding-bottom: 4px;
    -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 48px), transparent);
    mask-image: linear-gradient(to right, #000 calc(100% - 48px), transparent);
  }
  #tabs::-webkit-scrollbar { display: none; }
  .tab {
    appearance: none; flex: 0 0 auto;
    border: 1px solid rgba(255,214,180,.14);
    background: rgba(255,214,180,.05); color: var(--dim);
    padding: 7px 14px; border-radius: 999px;
    font-size: 12px; font-family: inherit; cursor: pointer;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: color .2s, border-color .2s, background .2s;
  }
  .tab:hover { color: var(--fg); border-color: rgba(255,214,180,.32); }
  .tab.on {
    color: #1a0f0a; background: var(--accent);
    border-color: var(--accent); font-weight: 600;
  }

  /* 自動切替・効果音のボタンとキー説明を右側にまとめる */
  #corner {
    flex: 0 0 auto;
    display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
  }
  #toggles { display: flex; gap: 8px; }
  #help {
    font-size: 11px; color: var(--dim); text-align: right;
    line-height: 1.8; pointer-events: none; user-select: none;
  }

  .pill {
    appearance: none; cursor: pointer; pointer-events: auto;
    display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
    border: 1px solid rgba(255,214,180,.14);
    background: rgba(255,214,180,.05); color: var(--dim);
    padding: 7px 14px; border-radius: 999px;
    font-size: 12px; font-family: inherit; letter-spacing: .02em;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: color .2s, border-color .2s, background .2s;
  }
  .pill:hover { color: var(--fg); border-color: rgba(255,214,180,.32); }
  .pill.on {
    color: #1a0f0a; background: var(--accent);
    border-color: var(--accent); font-weight: 600;
  }
  kbd {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10px; border: 1px solid rgba(255,214,180,.2);
    border-radius: 4px; padding: 1px 5px; color: var(--fg);
  }

  @media (max-width: 640px) {
    :root { --pad: 16px; }
    #title { font-size: 19px; }
    #help { display: none; }
    /*
     * 情報は上、操作は下。ラッパーの箱を消して #hud と #corner を
     * #chrome 直下へ昇格させ、order だけで並べ替える。
     */
    #bottom { display: contents; }
    #hud { order: 1; margin-bottom: auto; }
    #corner { order: 2; }
    #tabs { order: 3; gap: 6px; } /* 最下部 = 親指の届く位置 */
    .tab { padding: 9px 13px; font-size: 11px; }
    #toggles { gap: 6px; }
    .pill { padding: 8px 12px; font-size: 11px; gap: 5px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>
<div id="fade"></div>

<div id="chrome">
  <nav id="tabs"></nav>

  <div id="bottom">
    <div id="hud">
      <h1 id="title"></h1>
      <p id="desc"></p>
    </div>

    <div id="corner">
      <div id="toggles">
        <button id="auto" class="pill" type="button" aria-pressed="true">⟳ 自動切替 ON</button>
        <button id="sound" class="pill" type="button" aria-pressed="false">♪ 効果音 OFF</button>
      </div>
      <div id="help">
        <div><kbd>1</kbd>–<kbd>9</kbd> シーン切替 / <kbd>←</kbd><kbd>→</kbd> 前後（全 16 シーン）</div>
        <div><kbd>Space</kbd> 自動切替 / <kbd>S</kbd> 効果音 ON/OFF・ドラッグで視点回転</div>
      </div>
    </div>
  </div>
</div>

<script type="module" src="/src/main.ts"></script>

</body>
</html>
